# The robot description defines the generalized coordinates and how to map those
# to the underlying URDF dofs.

api_version: 1.0

# Defines the generalized coordinates. Each generalized coordinate is assumed
# to have an entry in the URDF.
# Lula will only use these joints to control the robot position.
cspace:
    - daogui_joint
    - left_shoulder_pitch_joint
    - right_shoulder_pitch_joint
    - left_shoulder_roll_joint
    - right_shoulder_roll_joint
    - left_shoulder_yaw_joint
    - right_shoulder_yaw_joint
    - left_elbow_joint
    - right_elbow_joint
    - left_wrist_roll_joint
    - right_wrist_roll_joint
    - left_wrist_yaw_joint
    - right_wrist_yaw_joint
    - left_wrist_pitch_joint
    - right_wrist_pitch_joint
    - left_jaw_left_finger_joint
    - left_jaw_right_finger_joint
    - right_jaw_left_finger_joint
    - right_jaw_right_finger_joint
default_q: [
    0.0,0.0442,0.044,-0.0067,0.006,0.0005,-0.0006,0.0721,0.0724,-0.0003,0.0002,0.0002,-1e-04,0.0131,0.0133,-0.0,0.0,-1e-04,0.0
]

acceleration_limits: [
   10,10,10,10,10,10,10,10,10,10,10,10,10,10,10,10,10,10,10
]

jerk_limits: [
   10000,10000,10000,10000,10000,10000,10000,10000,10000,10000,10000,10000,10000,10000,10000,10000,10000,10000,10000
]

# Most dimensions of the cspace have a direct corresponding element
# in the URDF. This list of rules defines how unspecified coordinates
# should be extracted or how values in the URDF should be overwritten.

cspace_to_urdf_rules:
    - {name: left_front_wheel_joint, rule: fixed, value: -1e-04}
    - {name: left_middle_wheel_joint, rule: fixed, value: -0.0}
    - {name: left_rear_wheel_joint, rule: fixed, value: -0.0}
    - {name: right_front_wheel_joint, rule: fixed, value: -0.0}
    - {name: right_middle_wheel_joint, rule: fixed, value: -1e-04}
    - {name: right_rear_wheel_joint, rule: fixed, value: -0.0}
    - {name: body_pitch_joint, rule: fixed, value: 0.3557}
    - {name: body_yaw_joint, rule: fixed, value: -0.0003}
    - {name: neck_yaw_joint, rule: fixed, value: 0.0004}
    - {name: neck_pitch_joint, rule: fixed, value: 0.0071}

